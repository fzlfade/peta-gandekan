<!DOCTYPE html>
<html>
<head>
    <title>Test Google Maps — Gandekan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; }
        #map { height: 100vh; width: 100%; }
        #info {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: white; padding: 10px 16px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info">
        Klik rumah warga → akan muncul marker<br>
        <span id="coords" style="font-size:12px;color:#666;">Belum ada klik</span>
    </div>

    <script>
        function initMap() {
            const center = { lat: -7.7316946528213, lng: 110.33960979406231 };

            const map = new google.maps.Map(document.getElementById('map'), {
                center: center,
                zoom: 14,
                mapId: 'DEMO_MAP_ID',
                mapTypeControlOptions: {
                    mapTypeIds: ['roadmap', 'satellite', 'hybrid']
                }
            });

            let marker = null;

            map.addListener('click', function(e) {
                const lat = e.latLng.lat();
                const lng = e.latLng.lng();

                if (marker) marker.setMap(null);

                marker = new google.maps.Marker({
                    position: { lat, lng },
                    map: map,
                    draggable: true,
                    animation: google.maps.Animation.DROP
                });

                document.getElementById('coords').textContent =
                    `Lat: ${lat.toFixed(8)}, Lng: ${lng.toFixed(8)}`;

                marker.addListener('dragend', function(e) {
                    const lat = e.latLng.lat();
                    const lng = e.latLng.lng();
                    document.getElementById('coords').textContent =
                        `Lat: ${lat.toFixed(8)}, Lng: ${lng.toFixed(8)}`;
                });
            });
        }
    </script>
    <!-- Ganti YOUR_API_KEY dengan API key dari Google Cloud Console -->
    <!-- Ganti YOUR_API_KEY dengan API key dari Google Cloud Console -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&loading=async" defer></script>
</body>
</html>
